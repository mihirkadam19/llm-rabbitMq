# compose.yaml
volumes:
  pgdata:
  keycloakdata:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: applier
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d applier"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      retries: 12

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./ingestion:/app
      - ./db:/app/db
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgresql://app:app@postgres:5432/applier
      OIDC_ISSUER: http://localhost:8080/realms/applier
      OIDC_AUDIENCE: ingestion
      OIDC_JWKS_URL: http://keycloak:8080/realms/applier/protocol/openid-connect/certs
      TENANT_NAME: tenant_0
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  llm_node:
    build:
      context: .
      dockerfile: llm_node/Dockerfile
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgresql://app:app@postgres:5432/applier
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      QUEUE: tenant_0_queue
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - keycloakdata:/opt/keycloak/data